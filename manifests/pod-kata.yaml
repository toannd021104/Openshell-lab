apiVersion: v1
kind: Pod
metadata:
  name: kata
  namespace: sandbox-lab
  labels:
    app: sandbox-lab
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    sandbox-lab/worker: "true"
  runtimeClassName: kata-qemu
  containers:
    - name: workload
      image: alpine:3.21.3
      command: ["sh", "-c", "sleep 86400"]
      resources:
        requests: {cpu: 250m, memory: 128Mi}
        limits: {cpu: "1", memory: 256Mi}
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
